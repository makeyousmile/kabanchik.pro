services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://mongo:27017"
      DB_NAME: "kabanchik"
      JWT_SECRET: "dev-secret-change"
      JWT_TTL: "24h"
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
